name: RaceDay POE verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore RunWayy.sln
      - run: dotnet build RunWayy.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test RunWayy.sln -c Release --no-build --logger "trx;LogFileName=unit-tests.trx"
      - name: Validate planning package
        run: pwsh -File scripts/validate-planning.ps1
      - name: API and original MVC workflows (SQLite)
        run: dotnet run --project tests/RunWay.Smoke -c Release --no-build -- "$PWD" Release
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for SQL Server, API and MVC
        run: |
          curl --fail --retry 60 --retry-all-errors --retry-delay 3 http://localhost:5001/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:5000/health
      - name: Build integration runner
        run: dotnet build tests/RunWay.Smoke -c Release
      - name: Validate standalone SQL script on clean SQL Server
        run: |
          docker compose cp docs/RaceDay_Schema.sql sqlserver:/tmp/RaceDay_Schema.sql
          docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "RaceDay_Pass123!" -C -b -i /tmp/RaceDay_Schema.sql
      - name: Real SQL Server and Azurite upload/download checks
        run: dotnet run --project tests/RunWay.Smoke -c Release --no-build -- "$PWD" Release http://localhost:5001/ http://localhost:5000/
      - if: always()
        run: docker compose logs && docker compose down
