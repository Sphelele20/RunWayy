services:
  api:
    build:
      context: .
      dockerfile: src/RunWay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RaceDay: Data Source=/data/raceday.db
      DataProtection__Path: /data/keys
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__AllowLocal: "true"
      Storage__LocalPath: /data/images
      Storage__Container: ${AZURE_STORAGE_CONTAINER:-raceday-images}
      Storage__ServiceUri: ${AZURE_STORAGE_SERVICE_URI:-}
      Storage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING:-}
    ports:
      - "127.0.0.1:5100:8080"
    volumes:
      - api-data:/data
  web:
    build:
      context: .
      dockerfile: src/RunWay.Web/Dockerfile
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://api:8080/
      DataProtection__Path: /keys
    ports:
      - "5200:8080"
    volumes:
      - web-keys:/keys
volumes:
  api-data:
  web-keys:
